services:
  buyinza-web:
    build: ./app
    volumes:
      - ./app:/app
    ports:
      - "30134:5000" # please change the host port number as per class instructions
    depends_on:
      - buyinza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bse4105
      POSTGRES_DB: userdb
      POSTGRES_HOST: buyinza-db
      POSTGRES_PORT: 5432
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  buyinza-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bse4105
      POSTGRES_DB: buyinzadb
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    ports:
      - "31134:5432" # please change the host port number as per class instructions
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
