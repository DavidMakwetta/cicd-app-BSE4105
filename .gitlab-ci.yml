stages:
  - build
  - test
  - deploy

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Docker client image
image: docker:24.0.7

services:
  - name: postgres:15
    alias: postgres

before_script:
  - docker info

build:
  stage: build
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/cicd-app:latest ./app
    - docker push $CI_REGISTRY_IMAGE/cicd-app:latest
  only:
    - main

test:
  stage: test
  variables:
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "secretpassword"
    POSTGRES_DB: "test_db"
  script:
    - echo "Running tests"

    - docker run -d --name db-test \
        -e POSTGRES_USER=$POSTGRES_USER \
        -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
        -e POSTGRES_DB=$POSTGRES_DB \
        postgres:15

    # Wait for PostgreSQL to be ready
    - echo "Waiting for PostgreSQL to start..."
    - |
      for i in {1..60}; do
        if docker exec db-test pg_isready -U $POSTGRES_USER; then
          echo "PostgreSQL is ready!"
          break
        fi
        echo "PostgreSQL is unavailable - waiting..."
        sleep 1
      done

    # Copy the SQL file to the PostgreSQL container and execute it (if init.sql exists)
    - |
      if [ -f "db_init/init.sql" ]; then
        echo "Loading initial data into the database..."
        docker cp db_init/init.sql db-test:/init.sql
        docker exec -u $POSTGRES_USER db-test psql -d $POSTGRES_DB -f /init.sql
      fi

    # Check tables in the database
    - docker exec db-test psql -U $POSTGRES_USER -d $POSTGRES_DB -c "\dt;"

    # Build and run the app container linked to the database container
    - docker build -t cicd-app ./app
    - docker run -d --name cicd-app --link db-test:db \
        -e POSTGRES_USER=$POSTGRES_USER \
        -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
        -e POSTGRES_DB=$POSTGRES_DB \
        -e POSTGRES_HOST=db \
        cicd-app

    # Execute tests inside the container
    - docker exec cicd-app pytest
      
    # Cleanup containers
    - docker stop cicd-app || true
    - docker rm cicd-app || true
    - docker stop db-test || true
    - docker rm db-test || true
  only:
    - main

deploy:
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ecdsa
    - chmod 600 ~/.ssh/id_ecdsa
    - ssh-add ~/.ssh/id_ecdsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - echo "Deploying to the production server"

    # Login to GitLab container registry, pull latest image, and restart compose services on the remote server
    - ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "
        echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin '$CI_REGISTRY' &&
        docker pull '$CI_REGISTRY_IMAGE/cicd-app:latest' &&
        cd '$DEPLOY_HOME/microservices/cicd-app' &&
        docker-compose up -d --build"

  only:
    - main